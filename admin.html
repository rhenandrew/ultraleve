<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ULTRALEVE | Painel</title><link rel="stylesheet" href="admin.css"><script src="content-model.js" defer></script><script src="admin.js" defer></script></head><body>
<header><strong>ULTRALEVE</strong><span>Painel da banda · Local</span><a href="/" target="_blank" rel="noopener">Ver site ↗</a></header>
<main><p id="status" role="status">Carregando…</p><nav aria-label="Seções do painel"><button data-tab="music" aria-pressed="true">Músicas</button><button data-tab="shows" aria-pressed="false">Shows</button></nav>
<section id="music"><h1>Músicas</h1><form id="music-form"><input type="hidden" name="id"><label>Título<input name="title" required maxlength="160"></label><label>Link do YouTube<input name="video" type="url" required placeholder="https://www.youtube.com/watch?v=…"></label><div class="actions"><button type="submit">Salvar música</button><button type="button" data-reset="music-form">Cancelar edição</button></div></form><div id="music-list"></div></section>
<section id="shows" hidden><h1>Agenda de shows</h1><form id="show-form"><input type="hidden" name="id"><label>Data<input name="date" type="date" required></label><label>Horário<input name="time" type="time"></label><label>Local<input name="place" required maxlength="160"></label><label>Cidade<input name="city" required maxlength="160"></label><label>Link dos ingressos<input name="tickets" type="url" placeholder="https://"></label><label class="check"><input name="cancelled" type="checkbox">Cancelado</label><div class="actions"><button type="submit">Salvar show</button><button type="button" data-reset="show-form">Cancelar edição</button></div></form><div id="show-list"></div></section>
</main></body></html>
