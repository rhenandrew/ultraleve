<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/ultraleve/"><title>ULTRALEVE | Acesso</title><link rel="stylesheet" href="admin.css"><script src="remote-login.js" defer></script></head><body><header><strong>ULTRALEVE</strong><span>Administração</span></header><main style="max-width:480px"><section><h1>Acesso da banda</h1><form id="login"><label>Usuário<input name="user" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Entrar</button></form><form id="password" hidden><label>Nova senha<input name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><label>Confirme a nova senha<input name="confirmation" type="password" minlength="12" autocomplete="new-password" required></label><button type="submit">Salvar nova senha</button></form><p id="status" role="status"></p><p><a id="panel" href="painel" hidden>Abrir painel</a></p><button id="logout" type="button" hidden>Sair</button></section></main></body></html>
