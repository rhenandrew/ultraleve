server {
    listen 80;
    server_name painel.bandaultraleve.com.br;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/ultraleve-acme; }
    location / { return 301 https://painel.bandaultraleve.com.br$request_uri; }
}
server {
    listen 443 ssl;
    server_name painel.bandaultraleve.com.br;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/painel.bandaultraleve.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/painel.bandaultraleve.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/ultraleve.conf;
    location = / { return 302 /ultraleve/login; }
    location / { return 404; }
}
