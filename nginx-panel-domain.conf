# Enable HTTP challenge first. Add HTTPS only after the certificate is issued.
server {
    listen 80;
    server_name painel.bandaultraleve.com.br;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ultraleve-acme;
    }
    location / {
        return 503;
    }
}
